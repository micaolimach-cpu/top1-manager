name: Import Top1 Manager V36

on:
  push:
    branches: [main]
    paths:
      - '.github/v36-upload/READY'

permissions:
  contents: write

jobs:
  import-v36:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and validate V36 package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v36-upload/part-* | base64 -d > /tmp/top1-v36.tar.xz
          mkdir -p /tmp/top1-v36
          tar -xJf /tmp/top1-v36.tar.xz -C /tmp/top1-v36
          test -s /tmp/top1-v36/index.html
          test -d /tmp/top1-v36/js
          test -d /tmp/top1-v36/assets
          test -s /tmp/top1-v36/js/26-v36-polish.js
          grep -qi 'Top 1 Manager' /tmp/top1-v36/index.html
          echo "Package validated: $(find /tmp/top1-v36 -type f | wc -l) files"

      - name: Install V36 in repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/' --exclude='LICENSE' /tmp/top1-v36/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github/v36-upload' ':!.github/workflows/import-v36.yml' ':!.github/workflows/probe-netlify.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'Import Top1 Manager V36 complete game build'
            git push
          fi

      - name: Cleanup temporary importer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/v36-upload
          rm -f .github/workflows/import-v36.yml .github/workflows/probe-netlify.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Clean temporary V36 importer'
            git push || true
          fi
