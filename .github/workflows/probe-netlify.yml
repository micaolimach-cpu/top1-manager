name: Probe Netlify deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-netlify.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe deploy URL
        shell: bash
        run: |
          set -x
          for URL in 'https://top1-manager.netlify.app/' 'https://6aa31ab63438529b52996c1f--top1-manager.netlify.app/' 'https://top1-manager.netlify.app/v36-package.tar.xz' 'https://6aa31ab63438529b52996c1f--top1-manager.netlify.app/v36-package.tar.xz'; do
            echo "=== $URL ==="
            curl -sSIL --max-time 20 "$URL" || true
          done
